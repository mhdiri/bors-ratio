<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>FCS Chart Test</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fcsapi/chart-js@latest/src/fcsapi-chart.css">
<script src="https://cdn.jsdelivr.net/gh/fcsapi/chart-js@latest/src/fcsapi-chart.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#131722}
  #chartparent{width:100%;height:100vh}
  #chart{width:100%;height:100%}
</style>
</head>
<body>
<div id="chartparent"><div id="chart"></div></div>
<script>
window.addEventListener('DOMContentLoaded', function() {
  if (typeof FCSAPIChart === 'undefined') {
    document.body.innerHTML = '<div style="padding:40px;color:#ef5350;font-family:Tahoma;text-align:center">❌ FCS Chart لود نشد</div>';
    return;
  }
  try {
    new FCSAPIChart({
      container: document.getElementById('chart'),
      parentid: 'chartparent',
      accessKey: '',
      symbol: 'BINANCE:BTCUSDT',
      period: '1H',
      theme: 'dark'
    });
    console.log('[FCS] OK');
  } catch(e) {
    document.body.innerHTML = '<div style="padding:40px;color:#ef5350;font-family:Tahoma">❌ ' + e.message + '</div>';
  }
});
</script>
</body>
</html>
