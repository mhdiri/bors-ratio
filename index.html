<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSE Ratio Chart</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #131722; }
  oak-view { width: 100%; height: 100%; display: block; }
</style>
<!-- OakView Web Component -->
<script type="module">
  import 'https://cdn.jsdelivr.net/npm/oakview@latest/dist/oakview.esm.js';
</script>
</head>
<body>

<oak-view id="tvChart" symbol="شیراز/شپدیس" theme="dark" layout="single"></oak-view>

<script type="module">
import { OakViewDataProvider } from 'https://cdn.jsdelivr.net/npm/oakview@latest/dist/oakview.esm.js';

// ============================================================
// Data Provider برای اتصال به API بورس تهران
// ============================================================
class TSEProvider extends OakViewDataProvider {
  constructor() {
    super();
    this.symbols = {};   // کش InsCode
    this.cache = {};     // کش تاریخچه
  }

  async initialize() {
    console.log('[TSEProvider] Initialized');
  }

  // دریافت InsCode از نماد فارسی
  async resolveSymbol(symbolName) {
    if (this.symbols[symbolName]) return this.symbols[symbolName];
    const res = await fetch(
      'https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/' +
      encodeURIComponent(symbolName)
    );
    const data = await res.json();
    const code = data.instrumentSearch?.[0]?.insCode;
    if (!code) throw new Error('Symbol not found: ' + symbolName);
    this.symbols[symbolName] = code;
    return code;
  }

  // دریافت تاریخچه OHLC
  async fetchHistorical(symbol, interval) {
    // symbol ممکن است "شیراز/شپدیس" باشد
    const parts = symbol.split('/');
    if (parts.length !== 2) throw new Error('Symbol must be "A/B"');
    const [s1, s2] = parts.map(x => x.trim());

    const key = s1 + '/' + s2;
    if (this.cache[key]) return this.cache[key];

    const [c1, c2] = await Promise.all([
      this.resolveSymbol(s1),
      this.resolveSymbol(s2)
    ]);

    const [h1, h2] = await Promise.all([
      this._getHistory(c1),
      this._getHistory(c2)
    ]);

    // ساخت نقشه OHLC
    const m1 = {}, m2 = {};
    h1.forEach(x => {
      const c = x.pClosing || x.pDrCotVal;
      if (c > 0) m1[String(x.dEven)] = {
        open: x.priceFirst || c,
        high: x.pMax || c,
        low: x.pMin || c,
        close: c
      };
    });
    h2.forEach(x => {
      const c = x.pClosing || x.pDrCotVal;
      if (c > 0) m2[String(x.dEven)] = {
        open: x.priceFirst || c,
        high: x.pMax || c,
        low: x.pMin || c,
        close: c
      };
    });

    // تاریخ‌های مشترک
    const dates = Object.keys(m1).filter(d => m2[d]).sort();
    const bars = [];
    let prevClose = null;

    for (const d of dates) {
      const ts = this._jalaliToTs(d);
      if (ts === null) continue;
      const rOpen = prevClose !== null ? prevClose : m1[d].open / m2[d].open;
      const rClose = m1[d].close / m2[d].close;
      const rHigh = Math.max(rOpen, rClose, m1[d].high / m2[d].high);
      const rLow = Math.min(rOpen, rClose, m1[d].low / m2[d].low);
      bars.push({
        time: ts,
        open: rOpen,
        high: rHigh,
        low: rLow,
        close: rClose,
        volume: 0
      });
      prevClose = rClose;
    }

    this.cache[key] = bars;
    return bars;
  }

  async _getHistory(insCode) {
    const res = await fetch(
      'https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyList/' +
      insCode + '/0'
    );
    const data = await res.json();
    return data.closingPriceDaily || data.closingPrice || [];
  }

  // تبدیل تاریخ میلادی YYYYMMDD به Unix Timestamp
  _jalaliToTs(s) {
    s = String(s);
    if (s.length !== 8) return null;
    const y = +s.substring(0, 4);
    const m = +s.substring(4, 6);
    const d = +s.substring(6, 8);
    if (y < 1990 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return null;
    return Math.floor(new Date(y, m - 1, d).getTime() / 1000);
  }

  async searchSymbols(query) {
    // اختیاری: جستجوی نمادها
    return [];
  }

  getAvailableIntervals(symbol) {
    return ['1D', '1W', '1M'];
  }
}

// ============================================================
// راه‌اندازی
// ============================================================
const chart = document.getElementById('tvChart');
const provider = new TSEProvider();

await provider.initialize();
chart.setDataProvider(provider);

// تنظیمات اضافی
chart.setAttribute('symbol', 'شیراز/شپدیس');
chart.setAttribute('theme', 'dark');

// گوش دادن به رویدادها
chart.addEventListener('ready', () => {
  console.log('[OakView] Chart ready');
  // فعال‌سازی مقیاس لگاریتمی به صورت پیش‌فرض
  const pane = chart.getChartAt(0);
  if (pane && pane.applyOptions) {
    pane.applyOptions({
      rightPriceScale: { mode: 1 } // 0=Normal, 1=Logarithmic, 2=Percentage
    });
  }
});
</script>
</body>
</html>
