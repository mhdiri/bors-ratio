<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسبت‌سنجی سهام بورس ایران</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        input, button { padding: 10px 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        #chart { width: 100%; height: 600px; border: 1px solid #eee; border-radius: 5px; }
        #error-box { display: none; background: #ffebee; color: #c62828; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ef9a9a; word-break: break-all; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نسبت‌سنجی دو سهم بورس ایران</h1>
        <div class="controls">
            <input type="text" id="symbol1" value="شیراز" placeholder="نماد اول">
            <span style="display: flex; align-items: center; font-weight: bold;">/</span>
            <input type="text" id="symbol2" value="شپدیس" placeholder="نماد دوم">
            <button onclick="loadRatio()">مقایسه کن</button>
        </div>
        <div id="error-box"></div>
        <div id="chart"></div>
    </div>

    <script>
        let chart;
        let lineSeries;

        function initChart() {
            chart = LightweightCharts.createChart(document.getElementById('chart'), {
                width: document.getElementById('chart').clientWidth,
                height: 600,
                layout: { background: { color: '#ffffff' }, textColor: '#333' },
                grid: { vertLines: { color: '#f0f3fa' }, horzLines: { color: '#f0f3fa' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { timeVisible: true, secondsVisible: false }
            });
            lineSeries = chart.addLineSeries({ color: '#2962FF', lineWidth: 2 });
        }

        async function loadRatio() {
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';

            const symbol1 = document.getElementById('symbol1').value;
            const symbol2 = document.getElementById('symbol2').value;

            try {
                const res = await fetch(`/api/ratio?symbol1=${encodeURIComponent(symbol1)}&symbol2=${encodeURIComponent(symbol2)}`);
                const data = await res.json();

                if (data.error) {
                    errorBox.innerText = 'خطای سرور: ' + data.error;
                    errorBox.style.display = 'block';
                    return;
                }

                if (!data.ratios || data.ratios.length === 0) {
                    errorBox.innerText = 'هیچ داده‌ای برای این دو نماد یافت نشد.';
                    errorBox.style.display = 'block';
                    return;
                }

                if (!chart) initChart();
                lineSeries.setData(data.ratios);
                chart.timeScale().fitContent();
            } catch (err) {
                errorBox.innerText = 'خطای شبکه: ' + err.message;
                errorBox.style.display = 'block';
            }
        }

        window.onload = loadRatio;
        window.addEventListener('resize', () => {
            if (chart) chart.applyOptions({ width: document.getElementById('chart').clientWidth });
        });
    </script>
</body>
</html>
