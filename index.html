<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دیباگ ۲</title>
<style>
body{font-family:monospace;padding:20px;background:#1e1e1e;color:#aed581;font-size:12px}
pre{background:#0d1117;padding:15px;border-radius:5px;white-space:pre-wrap;max-height:700px;overflow:auto;border:1px solid #333}
input,button{padding:8px;margin:5px;background:#2d2d2d;color:#fff;border:1px solid #444;border-radius:4px}
button{background:#4CAF50;cursor:pointer}
</style>
</head>
<body>
<h2 style="color:#fff">🐛 دیباگ ۲</h2>
<input id="s1" value="شیراز">
<input id="s2" value="شپدیس">
<button onclick="run()">اجرا</button>
<pre id="out">آماده...</pre>
<script>
const out = document.getElementById('out');
const log = m => { out.innerHTML += m + '\n'; };

async function fj(url){
  const r = await fetch(url);
  return await r.json();
}

async function run(){
  out.innerHTML = '';
  try {
    const s1 = document.getElementById('s1').value.trim();
    const s2 = document.getElementById('s2').value.trim();

    const r1 = await fj('https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/' + encodeURIComponent(s1));
    const r2 = await fj('https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/' + encodeURIComponent(s2));
    const c1 = r1.instrumentSearch?.[0]?.insCode;
    const c2 = r2.instrumentSearch?.[0]?.insCode;
    log('کد ۱: ' + c1 + ' | کد ۲: ' + c2);

    for(const mode of ['0', '1']){
      log('\n=== حالت /' + mode + ' ===');
      const d1 = await fj('https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyList/' + c1 + '/' + mode);
      log('کلیدها: ' + Object.keys(d1).join(', '));
      const list = d1.closingPriceDaily || d1.closingPrice || d1.closingPriceList || [];
      log('تعداد: ' + list.length);
      if(list.length){
        log('اولین: ' + JSON.stringify(list[0]).substring(0, 200));
        log('آخرین: ' + JSON.stringify(list[list.length-1]).substring(0, 200));
      }
    }
  } catch(e){
    log('❌ ' + e.message);
  }
}
run();
</script>
</body>
</html>
