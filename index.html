<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسبت‌سنجی حرفه‌ای - بورس ایران</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#131722;--panel:#1e222d;--panel2:#2a2e39;--border:#2a2e39;
  --text:#d1d4dc;--text2:#787b86;--accent:#2962FF;
  --green:#26a69a;--red:#ef5350;--yellow:#f7b600;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"Segoe UI",Tahoma,Arial;font-size:13px;background:var(--bg);color:var(--text)}
button{background:transparent;border:none;color:inherit;font-family:inherit;cursor:pointer}
input{background:transparent;border:none;color:inherit;font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== ساختار کلی ===== */
.tv{display:grid;grid-template-rows:38px 1fr 32px;height:100vh}
.tv-top{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--border);overflow:hidden}
.tv-main{display:grid;grid-template-columns:52px 1fr;overflow:hidden}
.tv-bottom{display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--panel);border-top:1px solid var(--border);overflow-x:auto}
.tv-bottom::-webkit-scrollbar{height:0}

/* ===== نوار بالا ===== */
.symbol-input{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--panel2);border-radius:6px;font-size:13px;font-weight:600;margin-left:2px}
.symbol-input input{width:90px;font-weight:600;font-size:13px}
.symbol-input input::placeholder{color:var(--text2);font-weight:400}
.symbol-input .slash{color:var(--text2)}
.symbol-input .go{background:var(--accent);color:#fff;padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600}
.symbol-input .go:hover{background:#1e4fd8}
.symbol-input .vs{color:var(--text2);font-size:11px;padding:0 4px}

.tf-bar{display:flex;align-items:center;gap:1px;margin:0 4px}
.tf-btn{padding:5px 8px;border-radius:4px;font-size:12px;color:var(--text2);font-weight:500;transition:all 0.15s}
.tf-btn:hover{background:var(--panel2);color:var(--text)}
.tf-btn.active{background:var(--panel2);color:var(--text)}

.sep{width:1px;height:20px;background:var(--border);margin:0 4px}

.tool-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:5px 8px;border-radius:4px;font-size:12px;color:var(--text);transition:background 0.15s}
.tool-btn:hover{background:var(--panel2)}
.tool-btn.icon{width:30px;height:30px;padding:0;font-size:16px;color:var(--text2)}
.tool-btn.icon:hover{color:var(--text)}
.tool-btn.accent{color:var(--accent)}

/* ===== دراپ‌داون ===== */
.drop{position:relative}
.drop-menu{position:absolute;top:100%;right:0;margin-top:6px;background:#1e222d;border:1px solid var(--border);border-radius:8px;padding:6px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:1000;display:none}
.drop-menu.open{display:block}
.drop-menu .head{font-size:10px;color:var(--text2);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
.drop-menu .item{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-radius:5px;font-size:12px;color:var(--text);cursor:pointer;transition:background 0.15s}
.drop-menu .item:hover{background:var(--panel2)}
.drop-menu .item.active{background:var(--accent);color:#fff}
.drop-menu .item .fav{color:var(--yellow);font-size:12px}
.drop-menu .item .check{color:var(--accent);font-size:14px}
.drop-menu .divider{height:1px;background:var(--border);margin:6px 4px}
.drop-menu label.item{cursor:pointer}
.drop-menu input[type=checkbox]{margin-left:auto;accent-color:var(--accent);width:14px;height:14px}

/* ===== نوار ابزار چپ ===== */
.left-bar{background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow-y:auto;overflow-x:hidden}
.left-bar::-webkit-scrollbar{width:0}
.lb-btn{width:38px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:17px;transition:all 0.15s}
.lb-btn:hover{background:var(--panel2);color:var(--text)}
.lb-btn.active{background:var(--accent);color:#fff}
.lb-sep{width:24px;height:1px;background:var(--border);margin:5px 0}
.lb-btn.pin{position:absolute;bottom:8px;left:8px}

/* ===== ناحیه نمودار ===== */
.chart-area{position:relative;background:var(--bg);overflow:hidden}
#chart{width:100%;height:100%}
#rsiWrap{position:absolute;bottom:0;right:0;left:0;height:140px;border-top:1px solid var(--border);background:var(--bg);display:none;z-index:3}
#rsiWrap.show{display:block}
#rsiChart{width:100%;height:100%}

/* لجند */
.legend{position:absolute;top:10px;right:70px;background:rgba(30,34,45,0.9);border-radius:6px;padding:8px 12px;font-size:11px;z-index:10;backdrop-filter:blur(8px);display:none;min-width:220px}
.legend.show{display:block}
.legend .head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:4px}
.legend .price{color:var(--accent);font-family:monospace;font-size:14px}
.legend .change{font-weight:700;font-family:monospace}
.legend .change.up{color:var(--green)}
.legend .change.down{color:var(--red)}
.legend .row{display:flex;justify-content:space-between;padding:2px 0;color:var(--text2)}
.legend .row span:last-child{color:var(--text);font-family:monospace}

/* پنل آمار */
.stats{position:absolute;top:10px;left:10px;background:rgba(30,34,45,0.9);border-radius:6px;padding:10px 12px;font-size:11px;z-index:10;backdrop-filter:blur(8px);display:none;min-width:170px}
.stats.show{display:block}
.stats .title{font-weight:700;color:var(--text);margin-bottom:6px;font-size:12px;display:flex;align-items:center;gap:6px}
.stats .row{display:flex;justify-content:space-between;padding:3px 0;gap:15px}
.stats .k{color:var(--text2)}
.stats .v{font-weight:700;font-family:monospace;color:var(--text)}
.stats .v.green{color:var(--green)}
.stats .v.red{color:var(--red)}
.stats .v.blue{color:var(--accent)}
.stats .v.orange{color:#f7b600}

/* سیگنال */
.signal{position:absolute;bottom:150px;right:70px;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;z-index:10;display:none;backdrop-filter:blur(8px)}
.signal.show{display:block}
.signal.buy{background:rgba(38,166,154,0.15);color:var(--green);border:1px solid rgba(38,166,154,0.5)}
.signal.sell{background:rgba(239,83,80,0.15);color:var(--red);border:1px solid rgba(239,83,80,0.5)}
.signal.neutral{background:rgba(247,182,0,0.15);color:#f7b600;border:1px solid rgba(247,182,0,0.5)}

/* کراس‌هیر */
.xh{position:absolute;bottom:8px;left:10px;background:var(--panel2);padding:3px 8px;border-radius:4px;font-size:11px;font-family:monospace;color:var(--text);z-index:10;display:none}

/* لودینگ */
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);background:var(--bg);z-index:20;font-size:13px}
.loading.hide{display:none}
.spin{width:32px;height:32px;border:2px solid var(--panel2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.7s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* علامت قیمت روی اسکیل */
.price-tag{position:absolute;right:0;padding:2px 6px;background:var(--red);color:#fff;font-size:11px;font-family:monospace;border-radius:3px;z-index:5;transform:translateY(-50%)}

@media(max-width:768px){
  .symbol-input input{width:60px}
  .legend{min-width:auto;right:auto;left:10px;top:auto;bottom:150px}
  .signal{bottom:auto;top:60px;right:10px}
}
</style>
</head>
<body>

<div class="tv">

  <!-- ============ نوار بالا ============ -->
  <div class="tv-top">
    <button class="tool-btn icon" title="جستجو">🔍</button>
    <button class="tool-btn icon" title="منو">☰</button>

    <div class="symbol-input">
      <input list="symbolsList" id="symbol1" placeholder="شیراز" autocomplete="off">
      <span class="vs">/</span>
      <input list="symbolsList" id="symbol2" placeholder="شپدیس" autocomplete="off">
      <button class="go" id="goBtn" onclick="loadRatio()">تحلیل</button>
    </div>
    <datalist id="symbolsList"></datalist>

    <div class="sep"></div>

    <div class="tf-bar" id="tfBar">
      <button class="tf-btn" data-r="7">۱ه</button>
      <button class="tf-btn" data-r="1">۱ر</button>
      <button class="tf-btn" data-r="30">۱م</button>
      <button class="tf-btn" data-r="90">۳م</button>
      <button class="tf-btn" data-r="180">۶م</button>
      <button class="tf-btn" data-r="365">۱س</button>
      <button class="tf-btn" data-r="1825">۵س</button>
      <button class="tf-btn" data-r="0">همه</button>
      <button class="tf-btn" onclick="openDrop('tfDrop',event)" title="بازه سفارشی">🕐</button>
    </div>
    <div class="drop">
      <div class="drop-menu" id="tfDrop">
        <div class="head">بازه‌های زمانی</div>
        <div class="item" onclick="setRange(7);closeDrops()">۱ هفته <span class="fav">★</span></div>
        <div class="item" onclick="setRange(30);closeDrops()">۱ ماه <span class="fav">★</span></div>
        <div class="item" onclick="setRange(90);closeDrops()">۳ ماه <span class="fav">★</span></div>
        <div class="item" onclick="setRange(180);closeDrops()">۶ ماه <span class="fav">★</span></div>
        <div class="item" onclick="setRange(365);closeDrops()">۱ سال <span class="fav">★</span></div>
        <div class="item" onclick="setRange(1095);closeDrops()">۳ سال <span class="fav">★</span></div>
        <div class="item" onclick="setRange(1825);closeDrops()">۵ سال <span class="fav">★</span></div>
        <div class="divider"></div>
        <div class="item" onclick="setRange(0);closeDrops()">همه داده‌ها</div>
      </div>
    </div>

    <div class="sep"></div>

    <div class="drop">
      <button class="tool-btn" onclick="openDrop('typeDrop',event)">📊 نوع نمودار ▾</button>
      <div class="drop-menu" id="typeDrop">
        <div class="item active" onclick="setChartType('line',this)">📈 خطی <span class="check">✓</span></div>
        <div class="item" onclick="setChartType('area',this)">🌊 ناحیه‌ای</div>
        <div class="item" onclick="setChartType('baseline',this)">➖ خط پایه</div>
      </div>
    </div>

    <div class="drop">
      <button class="tool-btn" onclick="openDrop('indDrop',event)">ƒx اندیکاتورها ▾</button>
      <div class="drop-menu" id="indDrop">
        <div class="head">میانگین متحرک</div>
        <label class="item"><span style="color:#FF6D00">MA 20</span><input type="checkbox" id="tMA20" checked onchange="redraw()"></label>
        <label class="item"><span style="color:#9C27B0">MA 50</span><input type="checkbox" id="tMA50" checked onchange="redraw()"></label>
        <label class="item"><span style="color:#E91E63">MA 200</span><input type="checkbox" id="tMA200" onchange="redraw()"></label>
        <div class="divider"></div>
        <div class="head">اندیکاتورها</div>
        <label class="item"><span style="color:#00BCD4">باندهای بولینگر</span><input type="checkbox" id="tBB" checked onchange="redraw()"></label>
        <label class="item">خطوط حداکثر/حداقل<input type="checkbox" id="tMinMax" onchange="redraw()"></label>
        <label class="item">RSI<input type="checkbox" id="tRSI" checked onchange="toggleRSI()"></label>
      </div>
    </div>

    <button class="tool-btn" onclick="exportCSV()" title="خروجی">📥</button>
    <button class="tool-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
    <button class="tool-btn" onclick="toggleStats()" id="statsBtn">📊</button>

    <div class="sep"></div>
    <button class="tool-btn accent" onclick="loadRatio()" title="به‌روزرسانی">⟳</button>
  </div>

  <!-- ============ بدنه ============ -->
  <div class="tv-main">

    <!-- نوار ابزار چپ -->
    <div class="left-bar">
      <button class="lb-btn active" title="کراس‌هیر">✛</button>
      <button class="lb-btn" title="خط روند">╱</button>
      <button class="lb-btn" title="خط افقی">─</button>
      <button class="lb-btn" title="کانال موازی">∥</button>
      <div class="lb-sep"></div>
      <button class="lb-btn" title="فیبوناچی">f</button>
      <button class="lb-btn" title="مستطیل">▭</button>
      <button class="lb-btn" title="متن">T</button>
      <div class="lb-sep"></div>
      <button class="lb-btn" title="زوم">🔍</button>
      <button class="lb-btn" onclick="resetZoom()" title="بازنشانی">⟲</button>
      <button class="lb-btn" title="قفل">🔒</button>
      <div class="lb-sep"></div>
      <button class="lb-btn" title="حذف">🗑</button>
    </div>

    <!-- ناحیه نمودار -->
    <div class="chart-area" id="chartArea">
      <div id="chart"></div>
      <div id="rsiWrap"><div id="rsiChart"></div></div>

      <div class="legend" id="legend">
        <div class="head">
          <span id="legSym">-</span>
          <span class="price" id="legPrice">-</span>
          <span class="change" id="legChange">-</span>
        </div>
        <div class="row"><span>دوره</span><span id="legRange">-</span></div>
        <div class="row"><span>تغییر</span><span id="legChangeAbs">-</span></div>
      </div>

      <div class="stats" id="statsPanel">
        <div class="title">📊 آمار نسبت</div>
        <div class="row"><span class="k">نسبت فعلی</span><span class="v blue" id="sCur">-</span></div>
        <div class="row"><span class="k">تغییر کل</span><span class="v" id="sChg">-</span></div>
        <div class="row"><span class="k">میانگین</span><span class="v" id="sMean">-</span></div>
        <div class="row"><span class="k">انحراف معیار</span><span class="v" id="sStd">-</span></div>
        <div class="row"><span class="k">Z-Score</span><span class="v orange" id="sZ">-</span></div>
        <div class="row"><span class="k">صدک تاریخی</span><span class="v" id="sPct">-</span></div>
      </div>

      <div class="signal" id="signalBox"></div>
      <div class="xh" id="xhInfo"></div>

      <div class="loading" id="loading">
        <div class="spin"></div>
        <div>دو نماد را وارد کنید و «تحلیل» را بزنید</div>
      </div>
    </div>

  </div>

  <!-- ============ نوار پایین ============ -->
  <div class="tv-bottom">
    <button class="tf-btn" onclick="resetZoom()" title="بازنشانی">⟲</button>
    <div class="sep"></div>
    <button class="tf-btn" data-r="1">۱ر</button>
    <button class="tf-btn" data-r="7">۱ه</button>
    <button class="tf-btn" data-r="30">۱م</button>
    <button class="tf-btn" data-r="90">۳م</button>
    <button class="tf-btn" data-r="180">۶م</button>
    <button class="tf-btn" data-r="365">۱س</button>
    <button class="tf-btn" data-r="1825">۵س</button>
    <button class="tf-btn" data-r="0">همه</button>
    <div class="sep"></div>
    <span style="font-size:11px;color:var(--text2);margin-right:auto" id="statusMsg">آماده</span>
  </div>

</div>

<script>
/* ============ کمکی ============ */
const $ = id => document.getElementById(id);
const setStatus = m => $('statusMsg').innerText = m;

function gregorianToTs(s){
  s = String(s);
  if(s.length !== 8) return null;
  const y = +s.substring(0,4), m = +s.substring(4,6), d = +s.substring(6,8);
  if(y < 1990 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return Math.floor(new Date(y, m-1, d).getTime()/1000);
}
async function fj(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

/* ============ دراپ‌داون ============ */
function openDrop(id, ev){
  ev.stopPropagation();
  document.querySelectorAll('.drop-menu').forEach(m => { if(m.id !== id) m.classList.remove('open'); });
  $(id).classList.toggle('open');
}
function closeDrops(){ document.querySelectorAll('.drop-menu').forEach(m => m.classList.remove('open')); }
document.addEventListener('click', closeDrops);
document.querySelectorAll('.drop-menu').forEach(m => m.addEventListener('click', e => e.stopPropagation()));

/* ============ تم ============ */
let isDark = true;
function toggleTheme(){
  isDark = !isDark;
  if(isDark){
    document.documentElement.style.setProperty('--bg', '#131722');
    document.documentElement.style.setProperty('--panel', '#1e222d');
    document.documentElement.style.setProperty('--panel2', '#2a2e39');
    document.documentElement.style.setProperty('--border', '#2a2e39');
    document.documentElement.style.setProperty('--text', '#d1d4dc');
    document.documentElement.style.setProperty('--text2', '#787b86');
    $('themeBtn').innerText = '☀️';
  } else {
    document.documentElement.style.setProperty('--bg', '#ffffff');
    document.documentElement.style.setProperty('--panel', '#f7f8fa');
    document.documentElement.style.setProperty('--panel2', '#eef1f6');
    document.documentElement.style.setProperty('--border', '#e0e3eb');
    document.documentElement.style.setProperty('--text', '#131722');
    document.documentElement.style.setProperty('--text2', '#787b86');
    $('themeBtn').innerText = '🌙';
  }
  if(currentRatios.length) redraw();
}

/* ============ لیست نمادها ============ */
let allSymbols = [];
async function loadAllSymbols(){
  try {
    const d = await fj('https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&paperTypes%5B0%5D=1&paperTypes%5B1%5D=2&paperTypes%5B2%5D=3&paperTypes%5B3%5D=4&paperTypes%5B4%5D=5&paperTypes%5B5%5D=6&paperTypes%5B6%5D=7&paperTypes%5B7%5D=8&paperTypes%5B8%5D=9&withBestLimits=false&hEven=0&RefID=0');
    const list = d.marketwatch || d.marketWatch || [];
    allSymbols = list.map(x => ({code: x.insCode, symbol: (x.lVal18AFC||'').trim(), name: (x.lVal30||'').trim()})).filter(x => x.symbol);
    $('symbolsList').innerHTML = allSymbols.map(x => '<option value="'+x.symbol+'">'+x.name+'</option>').join('');
    setStatus('✅ ' + allSymbols.length.toLocaleString('fa-IR') + ' نماد آماده');
  } catch(e){ setStatus('⚠️ خطا در دریافت لیست'); }
}
function findCode(s){ const f = allSymbols.find(x => x.symbol === s.trim()); return f ? f.code : null; }
async function getInsCode(s){ const l = findCode(s); if(l) return l; const d = await fj('https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/' + encodeURIComponent(s)); return d.instrumentSearch?.[0]?.insCode || null; }
async function getHistory(c){ const d = await fj('https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyList/' + c + '/0'); return d.closingPriceDaily || d.closingPrice || []; }

/* ============ اندیکاتورها ============ */
function calcMA(d, p){ const o = []; for(let i=p-1; i<d.length; i++){ let s = 0; for(let j=0; j<p; j++) s += d[i-j].value; o.push({time:d[i].time, value:s/p}); } return o; }
function calcBB(d, p=20, m=2){
  const u = [], l = [];
  for(let i=p-1; i<d.length; i++){
    let sum = 0; for(let j=0; j<p; j++) sum += d[i-j].value;
    const ma = sum/p; let v = 0; for(let j=0; j<p; j++) v += Math.pow(d[i-j].value-ma, 2);
    const sd = Math.sqrt(v/p);
    u.push({time:d[i].time, value:ma+m*sd}); l.push({time:d[i].time, value:ma-m*sd});
  }
  return {upper:u, lower:l};
}
function calcRSI(d, p=14){
  if(d.length < p+1) return [];
  const o = []; let g = 0, ls = 0;
  for(let i=1; i<=p; i++){ const df = d[i].value-d[i-1].value; if(df>=0) g += df; else ls -= df; }
  let ag = g/p, al = ls/p;
  o.push({time:d[p].time, value:100-100/(1+ag/(al||0.0001))});
  for(let i=p+1; i<d.length; i++){
    const df = d[i].value-d[i-1].value;
    const gg = df>0?df:0, ll = df<0?-df:0;
    ag = (ag*(p-1)+gg)/p; al = (al*(p-1)+ll)/p;
    o.push({time:d[i].time, value:100-100/(1+ag/(al||0.0001))});
  }
  return o;
}
function calcStats(d){
  const v = d.map(r => r.value), n = v.length;
  const mean = v.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(v.reduce((a,b)=>a+Math.pow(b-mean,2),0)/n);
  const s = [...v].sort((a,b)=>a-b);
  const cur = v[n-1];
  const z = sd>0 ? (cur-mean)/sd : 0;
  const pct = (s.filter(x=>x<=cur).length/n*100).toFixed(1);
  return {mean, std:sd, min:s[0], max:s[n-1], current:cur, zScore:z, pct:+pct, n};
}

/* ============ نمودار ============ */
let chart, rsiChart, series = {};
let allRatios = [], currentRatios = [];
let currentRange = 365, chartType = 'line';

function chartOpts(el, h){
  const bg = isDark ? '#131722' : '#ffffff';
  const grid = isDark ? '#1e222d' : '#f0f3fa';
  const text = isDark ? '#d1d4dc' : '#131722';
  const bd = isDark ? '#2a2e39' : '#e0e3eb';
  return {
    width: el.clientWidth, height: h,
    layout: {background:{color:bg}, textColor:text, fontSize:11},
    grid: {vertLines:{color:grid}, horzLines:{color:grid}},
    timeScale: {timeVisible:false, secondsVisible:false, borderColor:bd, rightOffset:5, barSpacing:6},
    crosshair: {mode: LightweightCharts.CrosshairMode.Normal},
    rightPriceScale: {borderColor:bd, scaleMargins:{top:0.1, bottom:0.1}}
  };
}

function initCharts(){
  const el = $('chart');
  el.innerHTML = '';
  if(chart){ chart.remove(); chart = null; }
  if(rsiChart){ rsiChart.remove(); rsiChart = null; }
  chart = LightweightCharts.createChart(el, chartOpts(el, el.clientHeight));

  if(chartType === 'area'){
    series.ratio = chart.addAreaSeries({lineColor:'#2962FF', topColor:'rgba(41,98,255,0.4)', bottomColor:'rgba(41,98,255,0.02)', lineWidth:2});
  } else if(chartType === 'baseline'){
    series.ratio = chart.addBaselineSeries({baseValue:{type:'price', price:0}, topLineColor:'#26a69a', topFillColor1:'rgba(38,166,154,0.3)', topFillColor2:'rgba(38,166,154,0.05)', bottomLineColor:'#ef5350', bottomFillColor1:'rgba(239,83,80,0.05)', bottomFillColor2:'rgba(239,83,80,0.3)', lineWidth:2});
  } else {
    series.ratio = chart.addLineSeries({color:'#2962FF', lineWidth:2});
  }

  series.ma20 = chart.addLineSeries({color:'#FF6D00', lineWidth:1});
  series.ma50 = chart.addLineSeries({color:'#9C27B0', lineWidth:1});
  series.ma200 = chart.addLineSeries({color:'#E91E63', lineWidth:1});
  series.bbU = chart.addLineSeries({color:'#00BCD4', lineWidth:1, lineStyle:2});
  series.bbL = chart.addLineSeries({color:'#00BCD4', lineWidth:1, lineStyle:2});
  series.maxL = chart.addLineSeries({color:'#ef5350', lineWidth:1, lineStyle:2});
  series.minL = chart.addLineSeries({color:'#26a69a', lineWidth:1, lineStyle:2});

  // RSI chart
  const rEl = $('rsiChart');
  rsiChart = LightweightCharts.createChart(rEl, chartOpts(rEl, 140));
  series.rsi = rsiChart.addLineSeries({color:'#FF9800', lineWidth:2});
  series.rsi70 = rsiChart.addLineSeries({color:'#ef5350', lineWidth:1, lineStyle:2});
  series.rsi30 = rsiChart.addLineSeries({color:'#26a69a', lineWidth:1, lineStyle:2});

  // همگام‌سازی
  let syncing = false;
  chart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if(syncing || !r || !rsiChart) return; syncing = true;
    rsiChart.timeScale().setVisibleLogicalRange(r);
    setTimeout(() => syncing = false, 0);
  });
  rsiChart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if(syncing || !r || !chart) return; syncing = true;
    chart.timeScale().setVisibleLogicalRange(r);
    setTimeout(() => syncing = false, 0);
  });

  // کراس‌هیر
  chart.subscribeCrosshairMove(p => {
    const info = $('xhInfo');
    if(!p.time || !currentRatios.length){ info.style.display = 'none'; return; }
    const f = currentRatios.find(r => r.time === p.time);
    if(!f){ info.style.display = 'none'; return; }
    info.innerText = new Date(p.time*1000).toLocaleDateString('fa-IR') + '  |  ' + f.value.toFixed(4);
    info.style.display = 'block';
  });

  if($('tRSI').checked) $('rsiWrap').classList.add('show');
}

function setChartType(t, el){
  chartType = t;
  document.querySelectorAll('#typeDrop .item').forEach(i => { i.classList.remove('active'); const c = i.querySelector('.check'); if(c) c.remove(); });
  el.classList.add('active');
  if(!el.querySelector('.check')) el.innerHTML += ' <span class="check">✓</span>';
  closeDrops();
  if(currentRatios.length){ initCharts(); redraw(); }
}

function resetZoom(){ if(chart) chart.timeScale().fitContent(); if(rsiChart) rsiChart.timeScale().fitContent(); }
function toggleRSI(){ const w = $('rsiWrap'); w.classList.toggle('show', $('tRSI').checked); setTimeout(() => { if(chart) chart.applyOptions({width:$('chart').clientWidth, height:$('chart').clientHeight}); if(rsiChart) rsiChart.applyOptions({width:$('rsiChart').clientWidth}); }, 50); }
function toggleStats(){ $('statsPanel').classList.toggle('show'); $('statsBtn').style.background = $('statsPanel').classList.contains('show') ? 'var(--panel2)' : 'transparent'; }

/* ============ رسم ============ */
function redraw(){
  if(!currentRatios.length || !chart) return;
  series.ratio.setData(currentRatios);

  const ap = (id, p, s) => { if($(id).checked && currentRatios.length > p) s.setData(calcMA(currentRatios, p)); else s.setData([]); };
  ap('tMA20', 20, series.ma20);
  ap('tMA50', 50, series.ma50);
  ap('tMA200', 200, series.ma200);

  if($('tBB').checked && currentRatios.length > 20){ const bb = calcBB(currentRatios, 20, 2); series.bbU.setData(bb.upper); series.bbL.setData(bb.lower); }
  else { series.bbU.setData([]); series.bbL.setData([]); }

  if($('tMinMax').checked){
    const st = calcStats(currentRatios);
    const f = currentRatios[0].time, l = currentRatios[currentRatios.length-1].time;
    series.maxL.setData([{time:f, value:st.max}, {time:l, value:st.max}]);
    series.minL.setData([{time:f, value:st.min}, {time:l, value:st.min}]);
  } else { series.maxL.setData([]); series.minL.setData([]); }

  if($('tRSI').checked && rsiChart){
    const r = calcRSI(currentRatios, 14);
    if(r.length){ $('rsiWrap').classList.add('show'); series.rsi.setData(r); series.rsi70.setData(r.map(x => ({time:x.time, value:70}))); series.rsi30.setData(r.map(x => ({time:x.time, value:30}))); }
  }

  chart.timeScale().fitContent();
  if(rsiChart) rsiChart.timeScale().fitContent();
}

/* ============ تایم‌فریم ============ */
function setRange(days){
  currentRange = days;
  document.querySelectorAll('#tfBar .tf-btn').forEach(b => b.classList.toggle('active', +b.dataset.r === days));
  document.querySelectorAll('.tv-bottom .tf-btn').forEach(b => b.classList.toggle('active', +b.dataset.r === days));
  if(!allRatios.length) return;
  if(days === 0) currentRatios = allRatios.slice();
  else {
    const lastT = allRatios[allRatios.length-1].time;
    const minT = lastT - days * 86400;
    currentRatios = allRatios.filter(r => r.time >= minT);
  }
  if(currentRatios.length) updateStatsAndSignal();
  if(currentRatios.length) redraw();
}

document.querySelectorAll('#tfBar .tf-btn, .tv-bottom .tf-btn').forEach(b => {
  if(b.dataset.r !== undefined){
    b.addEventListener('click', () => setRange(+b.dataset.r));
  }
});

/* ============ آمار و سیگنال ============ */
function updateStatsAndSignal(){
  const st = calcStats(currentRatios);
  const chg = ((st.current - currentRatios[0].value) / currentRatios[0].value * 100).toFixed(2);
  const s1 = $('symbol1').value, s2 = $('symbol2').value;

  $('legend').classList.add('show');
  $('legSym').innerText = s1 + ' / ' + s2;
  $('legPrice').innerText = st.current.toFixed(4);
  const chEl = $('legChange');
  chEl.innerText = (chg >= 0 ? '+' : '') + chg + '%';
  chEl.className = 'change ' + (chg >= 0 ? 'up' : 'down');
  $('legChangeAbs').innerText = (st.current - currentRatios[0].value >= 0 ? '+' : '') + (st.current - currentRatios[0].value).toFixed(4);

  const d1 = new Date(currentRatios[0].time*1000).toLocaleDateString('fa-IR');
  const d2 = new Date(currentRatios[currentRatios.length-1].time*1000).toLocaleDateString('fa-IR');
  $('legRange').innerText = d1 + ' → ' + d2;

  $('sCur').innerText = st.current.toFixed(4);
  $('sChg').innerText = (chg >= 0 ? '+' : '') + chg + '%';
  $('sChg').className = 'v ' + (chg >= 0 ? 'green' : 'red');
  $('sMean').innerText = st.mean.toFixed(4);
  $('sStd').innerText = st.std.toFixed(4);
  $('sZ').innerText = st.zScore.toFixed(2);
  $('sPct').innerText = st.pct + '%';

  const sig = $('signalBox');
  sig.classList.add('show');
  let txt, cls;
  if(st.zScore > 2){ txt = '🔴 اشباع خرید | Z=' + st.zScore.toFixed(2); cls = 'sell'; }
  else if(st.zScore < -2){ txt = '🟢 اشباع فروش | Z=' + st.zScore.toFixed(2); cls = 'buy'; }
  else if(st.zScore > 1){ txt = '🟠 بالاتر از میانگین | Z=' + st.zScore.toFixed(2); cls = 'neutral'; }
  else if(st.zScore < -1){ txt = '🟡 پایین‌تر از میانگین | Z=' + st.zScore.toFixed(2); cls = 'neutral'; }
  else { txt = '⚪ نرمال | Z=' + st.zScore.toFixed(2); cls = 'neutral'; }
  sig.innerText = txt;
  sig.className = 'signal show ' + cls;
}

/* ============ تحلیل ============ */
async function loadRatio(){
  const btn = $('goBtn');
  btn.disabled = true;
  $('loading').classList.remove('hide');
  $('loading').innerHTML = '<div class="spin"></div><div>در حال دریافت داده...</div>';
  setStatus('⏳ در حال دریافت...');

  try {
    const s1 = $('symbol1').value.trim(), s2 = $('symbol2').value.trim();
    if(!s1 || !s2){ alert('هر دو نماد را وارد کنید'); btn.disabled = false; return; }

    setStatus('دریافت شناسه نمادها...');
    const c1 = await getInsCode(s1), c2 = await getInsCode(s2);
    if(!c1){ alert('نماد "' + s1 + '" پیدا نشد'); btn.disabled = false; return; }
    if(!c2){ alert('نماد "' + s2 + '" پیدا نشد'); btn.disabled = false; return; }

    setStatus('دریافت تاریخچه قیمت...');
    const h1 = await getHistory(c1), h2 = await getHistory(c2);
    if(!h1.length || !h2.length){ alert('داده خالی'); btn.disabled = false; return; }

    const m1 = {}, m2 = {};
    h1.forEach(x => { const p = x.pClosing || x.pDrCotVal; if(p>0) m1[String(x.dEven)] = p; });
    h2.forEach(x => { const p = x.pClosing || x.pDrCotVal; if(p>0) m2[String(x.dEven)] = p; });

    const dates = Object.keys(m1).filter(d => m2[d]).sort();
    const uq = {};
    for(const d of dates){
      const ts = gregorianToTs(d);
      if(ts === null) continue;
      uq[ts] = { time: ts, value: m1[d] / m2[d] };
    }
    allRatios = Object.values(uq).sort((a,b) => a.time - b.time);
    if(allRatios.length < 2){ alert('داده کافی نیست'); btn.disabled = false; return; }

    // اعمال فیلتر
    if(currentRange === 0) currentRatios = allRatios.slice();
    else {
      const lastT = allRatios[allRatios.length-1].time;
      currentRatios = allRatios.filter(r => r.time >= lastT - currentRange * 86400);
    }

    $('loading').classList.add('hide');
    initCharts();
    updateStatsAndSignal();
    redraw();

    // نمایش پنل آمار
    $('statsPanel').classList.add('show');
    $('statsBtn').style.background = 'var(--panel2)';

    setStatus('✅ ' + currentRatios.length.toLocaleString('fa-IR') + ' نقطه | Z=' + calcStats(currentRatios).zScore.toFixed(2));

    localStorage.setItem('s1', s1);
    localStorage.setItem('s2', s2);

  } catch(e){
    $('loading').innerHTML = '<div>❌ خطا: ' + e.message + '</div>';
    setStatus('❌ ' + e.message);
  }
  btn.disabled = false;
}

/* ============ CSV ============ */
function exportCSV(){
  if(!currentRatios.length){ alert('ابتدا تحلیل کنید'); return; }
  const s1 = $('symbol1').value, s2 = $('symbol2').value;
  let csv = 'date,ratio\n';
  currentRatios.forEach(r => {
    csv += new Date(r.time*1000).toISOString().split('T')[0] + ',' + r.value + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = s1 + '_' + s2 + '_ratio.csv';
  a.click();
}

/* ============ ریسایز ============ */
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if(chart) chart.applyOptions({width: $('chart').clientWidth, height: $('chart').clientHeight});
    if(rsiChart) rsiChart.applyOptions({width: $('rsiChart').clientWidth, height: $('rsiChart').clientHeight});
  }, 100);
});

/* ============ شروع ============ */
loadAllSymbols();
$('symbol1').value = localStorage.getItem('s1') || 'شیراز';
$('symbol2').value = localStorage.getItem('s2') || 'شپدیس';
setRange(365);
</script>
