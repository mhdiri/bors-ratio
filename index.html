<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تست لیست نمادها</title>
<style>
body{font-family:Tahoma;padding:20px;background:#f4f6f9}
.box{max-width:800px;margin:auto;background:white;padding:20px;border-radius:10px}
input{padding:10px;width:100%;font-size:16px;border:1px solid #ddd;border-radius:5px}
#result{margin-top:15px;padding:15px;background:#f5f5f5;border-radius:5px;font-family:monospace;font-size:13px;white-space:pre-wrap;max-height:400px;overflow:auto}
</style>
</head>
<body>
<div class="box">
<h2>تست لیست نمادها</h2>
<input list="symbolsList" id="sym" placeholder="تایپ کنید...">
<datalist id="symbolsList"></datalist>
<div id="result">در حال دریافت...</div>
</div>
<script>
const r = document.getElementById('result');
function log(m){ r.innerHTML += m + '\n'; }

fetch('https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&paperTypes%5B0%5D=1&paperTypes%5B1%5D=2&paperTypes%5B2%5D=3&paperTypes%5B3%5D=4&paperTypes%5B4%5D=5&paperTypes%5B5%5D=6&paperTypes%5B6%5D=7&paperTypes%5B7%5D=8&paperTypes%5B8%5D=9&withBestLimits=false&hEven=0&RefID=0')
  .then(x => x.json())
  .then(d => {
    r.innerHTML = '';
    log('کلیدهای پاسخ: ' + Object.keys(d).join(', '));
    const list = d.marketwatch || d.marketWatch || d.closingPrice || [];
    log('تعداد نماد: ' + list.length);
    if(list.length){
      log('نمونه اول: ' + JSON.stringify(list[0]).substring(0, 300));
      const dl = document.getElementById('symbolsList');
      dl.innerHTML = list.map(x => '<option value="' + (x.lVal18AFC || '').trim() + '">' + (x.lVal30 || '') + '</option>').join('');
      log('✅ لیست در کادر بالا بارگذاری شد. تایپ کنید.');
    }
  })
  .catch(e => { r.innerHTML = '❌ خطا: ' + e.message; });
</script>
</body>
</html>
