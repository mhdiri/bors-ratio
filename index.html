<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دیباگ</title>
<style>
body{font-family:monospace;padding:20px;background:#1e1e1e;color:#aed581;font-size:12px}
.box{max-width:1200px;margin:auto}
h2{color:#fff}
input,button{padding:8px;margin:5px;font-family:inherit;background:#2d2d2d;color:#fff;border:1px solid #444;border-radius:4px}
button{background:#4CAF50;cursor:pointer}
pre{background:#0d1117;padding:15px;border-radius:5px;white-space:pre-wrap;overflow:auto;max-height:600px;border:1px solid #333}
</style>
</head>
<body>
<div class="box">
<h2>🐛 دیباگ</h2>
<div>
<input id="s1" value="شیراز">
<input id="s2" value="شپدیس">
<button onclick="run()">اجرا</button>
</div>
<pre id="out">آماده...</pre>
</div>
<script>
const out = document.getElementById('out');
const log = m => { out.innerHTML += m + '\n'; };

function jalaliToGregorian(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + jd + ((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  let gy = 400*Math.floor(days/146097);
  days %= 146097;
  if(days > 36524){ gy += 100*Math.floor(--days/36524); days %= 36524; if(days>=365) days++; }
  gy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){ gy += Math.floor((days-1)/365); days = (days-1)%365; }
  let gd = days+1;
  const isLeap = (gy%4===0 && gy%100!==0) || (gy%400===0);
  const sal_a = [0,31,isLeap?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;
  for(gm=0; gm<13 && gd>sal_a[gm]; gm++) gd -= sal_a[gm];
  return [gy, gm, gd];
}
function jalaliToTs(s){
  s = String(s);
  if(s.length !== 8) return null;
  const jy = parseInt(s.substring(0,4)), jm = parseInt(s.substring(4,6)), jd = parseInt(s.substring(6,8));
  if(jy<1300||jy>1500||jm<1||jm>12||jd<1||jd>31) return null;
  const [gy, gm, gd] = jalaliToGregorian(jy, jm, jd);
  return Math.floor(new Date(gy, gm-1, gd).getTime()/1000);
}

async function fj(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}

async function run(){
  out.innerHTML = '';
  try {
    const s1 = document.getElementById('s1').value.trim();
    const s2 = document.getElementById('s2').value.trim();

    log('=== مرحله ۱: جستجوی نماد ===');
    const r1 = await fj('https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/' + encodeURIComponent(s1));
    const r2 = await fj('https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/' + encodeURIComponent(s2));
    const c1 = r1.instrumentSearch?.[0]?.insCode;
    const c2 = r2.instrumentSearch?.[0]?.insCode;
    log('کد ۱: ' + c1);
    log('کد ۲: ' + c2);
    if(!c1 || !c2){ log('❌ کد پیدا نشد'); return; }

    log('\n=== مرحله ۲: دریافت تاریخچه (adjusted) ===');
    let h1, h2;
    try {
      const d1 = await fj('https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyList/' + c1 + '/1');
      h1 = d1.closingPrice || d1.closingPriceDaily || [];
      log('سهم ۱: ' + h1.length + ' رکورد');
      log('کلیدهای پاسخ: ' + Object.keys(d1).join(', '));
    } catch(e){ log('❌ سهم ۱: ' + e.message); }

    try {
      const d2 = await fj('https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyList/' + c2 + '/1');
      h2 = d2.closingPrice || d2.closingPriceDaily || [];
      log('سهم ۲: ' + h2.length + ' رکورد');
    } catch(e){ log('❌ سهم ۲: ' + e.message); }

    if(!h1 || !h1.length){
      log('\n⚠️ تاریخچه ۱ خالی، تلاش با adjusted=0');
      const d1 = await fj('https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyList/' + c1 + '/0');
      h1 = d1.closingPrice || d1.closingPriceDaily || [];
      log('سهم ۱ (0): ' + h1.length + ' رکورد');
    }
    if(!h2 || !h2.length){
      log('\n⚠️ تاریخچه ۲ خالی، تلاش با adjusted=0');
      const d2 = await fj('https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyList/' + c2 + '/0');
      h2 = d2.closingPrice || d2.closingPriceDaily || [];
      log('سهم ۲ (0): ' + h2.length + ' رکورد');
    }

    if(h1.length && h2.length){
      log('\n=== نمونه رکورد اول ===');
      log('سهم ۱: ' + JSON.stringify(h1[0]));
      log('سهم ۲: ' + JSON.stringify(h2[0]));
    }

    log('\n=== مرحله ۳: ساخت نقشه ===');
    const m1 = {}, m2 = {};
    h1.forEach(x => { const p = x.pClosing || x.pDrCotVal; if(p>0) m1[String(x.dEven)] = p; });
    h2.forEach(x => { const p = x.pClosing || x.pDrCotVal; if(p>0) m2[String(x.dEven)] = p; });
    log('تعداد کلید m1: ' + Object.keys(m1).length);
    log('تعداد کلید m2: ' + Object.keys(m2).length);

    log('\n=== مرحله ۴: تاریخ مشترک ===');
    const dates = Object.keys(m1).filter(d => m2[d]).sort();
    log('تاریخ مشترک: ' + dates.length);
    if(dates.length) log('نمونه: ' + dates[0] + ' | ' + dates[dates.length-1]);

    log('\n=== مرحله ۵: تبدیل تاریخ ===');
    let okCount = 0, failCount = 0;
    const samples = [];
    for(let i = 0; i < Math.min(dates.length, 3); i++){
      const ts = jalaliToTs(dates[i]);
      samples.push(dates[i] + ' → ' + ts);
      if(ts === null) failCount++; else okCount++;
    }
    log('نمونه تبدیل: ' + samples.join(' | '));
    log('موفق: ' + okCount + ' | ناموفق: ' + failCount);

    log('\n=== نتیجه ===');
    if(dates.length < 2) log('❌ تاریخ مشترک کمتر از ۲');
    else if(failCount > 0) log('❌ تبدیل تاریخ ناموفق');
    else log('✅ همه چیز درست است');

  } catch(e){
    log('❌ خطای کلی: ' + e.message);
  }
}
run();
</script>
</body>
</html>
